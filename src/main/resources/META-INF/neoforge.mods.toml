modLoader="javafml"
loaderVersion="${loader_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
updateJSONURL="${mod_update_url}"
displayURL="${mod_display_url}"
logoFile="logo.png"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.recruits]]
modId="neoforge"
type="required"
versionRange="${loader_range}"
ordering="NONE"
side="BOTH"

[[dependencies.recruits]]
modId="minecraft"
type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="BOTH"

[[dependencies.recruits]]
modId="architectury"
type="required"
versionRange="[${architectury_version},)"
ordering="AFTER"
side="BOTH"
